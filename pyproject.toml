[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "spender"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Spectrum encoder and decoder"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "Peter Melchior", email = "peter.m.melchior@gmail.com" }
]
keywords = ["spectroscopy", "autoencoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "torch",
    "numpy",
    "accelerate",
    "astropy",
    "humanize",
    "psutil",
    "GPUtil",
    "nflows",
    "huggingface_hub",
    "datasets",
    "pyarrow",
    "fsspec",
]

[project.urls]
Homepage = "https://github.com/pmelchior/spender"

[tool.setuptools]
packages = ["spender", "spender.data"]

[tool.setuptools.package-data]
"spender.data" = ["*.txt"]

[tool.setuptools_scm]
version_file = "spender/_version.py"
